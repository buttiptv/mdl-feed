name: Fetch MyDramaList broadcast feed

on:
  schedule:
    # Twice a day, well off the hour so it doesn't pile up with everyone
    # else's cron jobs. Times are UTC.
    - cron: "17 2,14 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fetcher
        id: fetch
        continue-on-error: true
        run: python3 mdl_fetch.py

      - name: Upload debug HTML (only created if a calendar parsed to zero episodes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdl-debug-html
          path: debug-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job if the fetch step failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1

      - name: Commit and push if the feed changed
        run: |
          git config user.name "mdl-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mdl_broadcast.json
          if git diff --cached --quiet; then
            echo "No change in mdl_broadcast.json, nothing to commit."
          else
            git commit -m "Update mdl_broadcast.json"
            git push
          fi
